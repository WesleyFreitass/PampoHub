version: '3.8'

services:
  pampo-hub:
    container_name: pampo-hub
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3100:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
